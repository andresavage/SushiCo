		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.dropotron.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

			<script>
				// Menu is rendered from menu.json so items/prices can be edited in one place.
				(function () {
					function escapeHtml(s) {
						return String(s == null ? '' : s)
							.replace(/&/g, '&amp;')
							.replace(/</g, '&lt;')
							.replace(/>/g, '&gt;')
							.replace(/"/g, '&quot;');
					}

					function renderItem(item) {
						var name = escapeHtml(item.name || '');
						var price = item.price ? ' <span class="menu-item-price">' + escapeHtml(item.price) + '</span>' : '';
						var desc = item.description ? '<div class="menu-item-description">' + escapeHtml(item.description) + '</div>' : '';
						return '<div class="menu-item">' +
							'<div class="menu-item-name">' + name + price + '</div>' +
							desc +
						'</div>';
					}

					function renderRollsHeader(headers) {
						var parts = [];
						for (var i = 0; i < headers.length; i++) {
							var h = headers[i];
							var icon = h.icon ? ' <img src="' + escapeHtml(h.icon) + '" alt="" aria-hidden="true">' : '';
							if (i > 0) parts.push('<div class="menu-piece-separator" aria-hidden="true">/</div>');
							parts.push(
								'<div class="menu-piece-line">' +
									'<div class="menu-piece-top menu-category">' + escapeHtml(h.label || '') + icon + '</div>' +
									(h.sub ? '<div class="menu-piece-sub">' + escapeHtml(h.sub) + '</div>' : '') +
								'</div>'
							);
						}
						return '<div class="menu-piece-lines">' + parts.join('') + '</div>' +
							'<div class="menu-category-divider" aria-hidden="true"></div>';
					}

					function renderSection(section) {
						var items = (section.items || []).map(renderItem).join('');
						if (section.type === 'rolls') {
							var header = renderRollsHeader(section.headers || []);
							var badge = section.badge
								? '<div class="rolls-special-badge"><img src="' + escapeHtml(section.badge.src) + '" alt="' + escapeHtml(section.badge.alt || '') + '"></div>'
								: '';
							return '<div class="menu-section menu-section-rolls">' + header + badge + items + '</div>';
						}
						var title = section.title ? '<h2 class="menu-category">' + escapeHtml(section.title) + '</h2>' : '';
						var sBadge = section.badge
							? '<div class="snacks-special-badge"><img src="' + escapeHtml(section.badge.src) + '" alt="' + escapeHtml(section.badge.alt || '') + '" aria-hidden="true"></div>'
							: '';
						return '<div class="menu-section">' + title + sBadge + items + '</div>';
					}

					function render(data) {
						var root = document.getElementById('menu-root');
						if (root) {
							root.innerHTML = (data.sections || []).map(renderSection).join('');
						}
						var disc = document.getElementById('menu-disclaimer');
						if (disc) {
							disc.innerHTML = (data.disclaimers || [])
								.map(function (d) { return '<em>' + escapeHtml(d) + '</em>'; })
								.join('<br>');
						}
					}

					fetch('menu.json?v=20260603-1', { cache: 'no-store' })
						.then(function (resp) {
							if (!resp.ok) throw new Error('menu fetch failed');
							return resp.json();
						})
						.then(render)
						.catch(function () {
							var root = document.getElementById('menu-root');
							if (root) root.innerHTML = '<div class="menu-empty" style="text-align:center; color:#666; padding:2em 1em;">Menu is temporarily unavailable. Please check back soon.</div>';
						});
				})();
			</script>

	</body>
</html>
